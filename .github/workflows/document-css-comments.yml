name: Document CSS comments only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/document-css-comments.yml"

permissions:
  contents: write

jobs:
  document-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add comments without changing CSS rules
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          FILES = [
              Path("styles/theme.css"),
              Path("styles/components.css"),
              Path("styles/responsive.css"),
              Path("styles/index.css"),
          ]

          TOC = {
              "theme.css": [
                  "Design-token palette en semantische kleurrollen",
                  "Grafiekpalet en typografie",
                  "Fluid lettergroottes, regelhoogtes en tracking",
                  "Fluid spacing en componentafmetingen",
                  "Geometry, radius, borders en shadows",
                  "Tailwind/shadcn token bridge",
                  "Pagina- en sectiethema's",
              ],
              "components.css": [
                  "Base, reset en gedeelde typografie",
                  "Layoutcontainers en sectieritme",
                  "Cards, panels, badges en knoppen",
                  "Header, navigatie en mobiele menu's",
                  "Page intro, samenvattingen en hero-content",
                  "Keuzekaarten, checklists, tabellen en calculator",
                  "Marketing-, software- en developmentpresentatie",
                  "Modals, install prompts en printregels",
              ],
              "responsive.css": [
                  "Fluid viewport-, type-, spacing- en layouttokens",
                  "Containers en container queries",
                  "Complexe grids en cardgedrag",
                  "Centrale typografische guards",
                  "Controls, registry-secties en brede visuals",
                  "Tablet-, mobiel- en printbreakpoints",
              ],
              "index.css": [
                  "Imports van de drie uitvoerende stylesheets",
                  "Globale radius- en kleuraliassen",
                  "Projectbrede documentatie en uitzonderingen",
              ],
          }

          DOC_MARKER = "EARTH SPAS CSS DOCUMENTATIE"
          RANGE_RE = re.compile(r"/\*\s*-?\d+(?:\.\d+)?px\s+-\s+-?\d+(?:\.\d+)?px\s+\*/")
          DECL_RE = re.compile(r"^(?P<indent>\s*)--[\w-]+\s*:\s*clamp\(")

          def documentation_block(path: Path) -> list[str]:
              items = TOC[path.name]
              lines = [
                  "/* ==========================================================================\n",
                  f"   {DOC_MARKER}\n",
                  "\n",
                  "   Inhoudsopgave\n",
              ]
              for number, item in enumerate(items, start=1):
                  lines.append(f"   {number}. {item}\n")
              lines.extend([
                  "\n",
                  "   Onderhoudsregel\n",
                  "   - Alleen de beschreven classgroep of tokenfamilie in deze sectie aanpassen.\n",
                  "   - Fluid clamp-bereiken zijn omgerekend op basis van 1rem = 16px.\n",
                  "   - Deze documentatie wijzigt geen selector, property, waarde of import.\n",
                  "   ========================================================================== */\n",
                  "\n",
              ])
              return lines

          def split_clamp_arguments(value: str) -> list[str]:
              start = value.find("clamp(")
              if start < 0:
                  return []
              body = value[start + len("clamp("):]
              depth = 0
              current: list[str] = []
              parts: list[str] = []
              for char in body:
                  if char == "(" :
                      depth += 1
                  elif char == ")":
                      if depth == 0:
                          parts.append("".join(current).strip())
                          return parts
                      depth -= 1
                  if char == "," and depth == 0:
                      parts.append("".join(current).strip())
                      current = []
                  else:
                      current.append(char)
              return []

          def length_to_px(value: str) -> float | None:
              match = re.fullmatch(r"\s*(-?\d+(?:\.\d+)?)\s*(rem|px)\s*", value)
              if not match:
                  return None
              amount = float(match.group(1))
              return amount * 16 if match.group(2) == "rem" else amount

          def format_px(value: float) -> str:
              rounded = round(value + 0.0, 2)
              return f"{rounded:.2f}".rstrip("0").rstrip(".")

          def range_comment(block: str, indent: str) -> str | None:
              if RANGE_RE.search(block):
                  return None
              args = split_clamp_arguments(block)
              if len(args) != 3:
                  return None
              minimum = length_to_px(args[0])
              maximum = length_to_px(args[2])
              if minimum is None or maximum is None:
                  return None
              return f"{indent}/* {format_px(minimum)}px - {format_px(maximum)}px */\n"

          def transform(path: Path) -> None:
              original = path.read_text(encoding="utf-8")
              original_lines = original.splitlines(keepends=True)
              output: list[tuple[str, bool]] = []

              if DOC_MARKER not in original:
                  output.extend((line, True) for line in documentation_block(path))

              index = 0
              while index < len(original_lines):
                  line = original_lines[index]
                  match = DECL_RE.match(line)
                  if not match:
                      output.append((line, False))
                      index += 1
                      continue

                  block_lines = [line]
                  cursor = index + 1
                  while ";" not in "".join(block_lines) and cursor < len(original_lines):
                      block_lines.append(original_lines[cursor])
                      cursor += 1

                  comment = range_comment("".join(block_lines), match.group("indent"))
                  if comment:
                      output.append((comment, True))

                  output.extend((existing, False) for existing in block_lines)
                  index = cursor

              new_text = "".join(line for line, _ in output)

              # Hard guarantee: every original line must remain byte-for-byte and in order.
              new_lines = new_text.splitlines(keepends=True)
              cursor = 0
              for original_line in original_lines:
                  while cursor < len(new_lines) and new_lines[cursor] != original_line:
                      cursor += 1
                  if cursor >= len(new_lines):
                      raise RuntimeError(f"Original CSS line changed or removed in {path}: {original_line!r}")
                  cursor += 1

              # Hard guarantee: every inserted non-empty line is CSS comment syntax only.
              for inserted_line, inserted in output:
                  if not inserted or not inserted_line.strip():
                      continue
                  stripped = inserted_line.lstrip()
                  if not (stripped.startswith("/*") or stripped.startswith("*") or stripped.startswith("*/") or stripped.startswith("   ")):
                      raise RuntimeError(f"Non-comment content inserted into {path}: {inserted_line!r}")

              path.write_text(new_text, encoding="utf-8", newline="")
              print(f"Documented {path} without changing existing CSS lines.")

          for css_file in FILES:
              transform(css_file)
          PY

      - name: Remove one-time workflow and verify diff
        shell: bash
        run: |
          rm .github/workflows/document-css-comments.yml
          git diff --check
          git status --short

      - name: Commit comment-only CSS documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/theme.css styles/components.css styles/responsive.css styles/index.css .github/workflows/document-css-comments.yml
          git commit -m "Document CSS structure and fluid ranges [skip ci]"
          git push
