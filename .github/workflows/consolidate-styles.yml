name: Consolidate styles

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consolidate styles
        run: node scripts/consolidate-styles.mjs

      - name: Commit canonical style structure
        run: |
          if git diff --quiet; then
            echo "Style structure already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css styles
          git commit -m "Consolidate styles to four canonical files [skip ci]"
          git push
