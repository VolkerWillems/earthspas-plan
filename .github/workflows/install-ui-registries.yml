name: Install official UI registry components

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-ui-registries.yml

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install official registry components
        shell: bash
        run: |
          set -euo pipefail

          npx --yes shadcn@latest add @7ovr/timeline-1 -y

          integration_block=""
          for block in integrations-1 integration-1 integrations-2 integration-2 integrations-3 integration-3; do
            if curl -fsS "https://7ovr.com/r/${block}.json" >/dev/null; then
              npx --yes shadcn@latest add "@7ovr/${block}" -y
              integration_block="${block}"
              break
            fi
          done
          test -n "${integration_block}"

          how_it_works_block=""
          for block in how-it-works-1 how-it-works-2 how-it-works-3; do
            if curl -fsS "https://7ovr.com/r/${block}.json" >/dev/null; then
              npx --yes shadcn@latest add "@7ovr/${block}" -y
              how_it_works_block="${block}"
              break
            fi
          done
          test -n "${how_it_works_block}"

          npx --yes shadcn@latest add @bklit/stat-card-area-01 -y
          npx --yes shadcn@latest add @bklit/stat-card-choropleth-01 -y
          npx --yes shadcn@latest add @bklit/line-chart -y
          npx --yes shadcn@latest add @bklit/funnel-chart -y
          npx --yes shadcn@latest add @bklit/pie-chart -y
          npx --yes shadcn@latest add @bklit/brush -y
          npx --yes shadcn@latest add @bklit/legend -y
          npx --yes shadcn@latest add @bklit/grid -y

          npm install

          cat > .registry-install.json <<JSON
          {
            "sevenOvr": [
              "timeline-1",
              "${integration_block}",
              "${how_it_works_block}"
            ],
            "bklit": [
              "stat-card-area-01",
              "stat-card-choropleth-01",
              "line-chart",
              "funnel-chart",
              "pie-chart",
              "brush",
              "legend",
              "grid"
            ]
          }
          JSON

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Install official 7Ovr and Bklit components"
          git push origin HEAD:main
